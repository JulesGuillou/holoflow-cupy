[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holoflow"
version = "0.1.0"
description = "Real-time Doppler holography"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4.4",
  "cupy-cuda13x>=14.0.1",
  "PySide6>=6.11.0",
  "PyOpenGL>=3.1.10",
  "pyyaml>=6.0",
  "holofile",
  "viztracer>=1.1.1",
  "matplotlib>=3.10.8",
  "tabulate>=0.10.0",
  "torch>=2.11.0",
  "jax[cuda13]>=0.8.1 ; sys_platform == 'linux'",
  "triton-windows>=3.6.0.post26 ; sys_platform == 'win32'",
  "triton>=3.6.0 ; sys_platform == 'linux'",
]

[project.scripts]
holoflow = "holoflow.main:main"
cupy_naive = "cupy_naive.main:main"
cupy_threaded = "cupy_threaded.main:main"
cupy_streams = "cupy_streams.main:main"
pytorch_naive = "pytorch_naive.main:main"
pytorch_threaded = "pytorch_threaded.main:main"
pytorch_streams = "pytorch_streams.main:main"
jax_naive = "jax_naive.main:main"
jax_streams = "jax_streams.main:main"
holoflow_nsys_profile = "holoflow_benchmarks.nsys_profile:main"
holoflow_nsys_export_sqlite = "holoflow_benchmarks.nsys_export_sqlite:main"
holoflow_nsys_explore = "holoflow_benchmarks.nsys_explore_sqlite:main"
holoflow_nsys_iteration_metrics = "holoflow_benchmarks.nsys_iteration_metrics:main"
holoflow_metrics_pipeline = "holoflow_benchmarks.metrics_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/holoflow",
  "src/holoflow_benchmarks",
  "src/cupy_naive",
  "src/cupy_threaded",
  "src/cupy_streams",
  "src/pytorch_naive",
  "src/pytorch_threaded",
  "src/pytorch_streams",
  "src/jax_naive",
  "src/jax_streams",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
holofile = { git = "https://github.com/JulesGuillou/holofile.git", rev = "main" }
torch = { index = "pytorch-cu130" }
