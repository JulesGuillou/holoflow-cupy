# JAX-managed stream LDH benchmark configuration.
#
# JAX owns CUDA stream selection and dependency tracking, so this benchmark
# does not create explicit CUDA streams or events. The `streams` section
# controls how many asynchronous JAX-dispatched display outputs are kept
# in flight before the oldest output is collected.

input:
  # path: 'E:\InputData\250220_GUJ0206_L.holo'
  # file_path: C:\Users\guill\Documents\holofiles_data\250527_GUJ_L_2.holo
  file_path: /home/julesg/Downloads/250527_GUJ_L_2.holo

signal:
  sample_rate_hz: 37000.0
  doppler_low_hz: 8000.0
  doppler_high_hz: 16000.0

  propagation_distance_m: 4.86e-1
  wavelength_m: 8.52e-7
  dx_m: 2.0e-5
  dy_m: 2.0e-5

schedule:
  batch_frames: 32
  batches_per_output: 64

benchmark:
  seconds: 10.0
  repetitions: 10
  warmup_outputs: 1

display:
  report_path: 'jax_streams_report.txt'
  show_image: true
  contrast_roi_radius: 0.8
  contrast_low_percentile: 0.2
  contrast_high_percentile: 99.8

dtypes:
  acquisition: uint8
  real: float32
  complex: complex64

execution:
  # modes:
  #   - name: 'jax-streams | precompute=on | prealloc=on | gil=off'
  #     precompute_static_tensors: true
  #     preallocate_work_buffers: true
  #     enable_dummy_gil_thread: false

  dummy_gil_inner_loops: 200000
  dummy_gil_switch_interval_s: 0.0000005

  # Matrix mode is still supported:
  #
  mode_matrix:
    precompute_static_tensors: [false, true]
    preallocate_work_buffers: [false, true]
    dummy_gil_thread: [false, true]

streams:
  # Logical upper bound for in-flight JAX-dispatched outputs.
  num_slots: 32

  # Number of display outputs kept submitted ahead of the oldest collected
  # output. JAX/XLA manages the underlying CUDA streams and dependencies.
  pipeline_prefetch_batches: 8
